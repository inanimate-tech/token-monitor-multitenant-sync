name: Hosted

# Fork-only: checks hosted/ and, when enabled, deploys it from main. Deploying only
# from this public workflow means every running build has a public commit and log.

on:
  push:
    branches: [main]
    paths: ['hosted/**', 'worker/src/**', '.github/workflows/hosted.yml']
  pull_request:
    paths: ['hosted/**', 'worker/src/**', '.github/workflows/hosted.yml']

permissions:
  contents: read

concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hosted

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # Opt in with repository variable HOSTED_DEPLOY=true and secrets
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name == 'push' && vars.HOSTED_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
