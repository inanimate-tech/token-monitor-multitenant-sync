name: Hosted

# Fork-only: checks hosted/. Deploys are Cloudflare Workers Builds (see hosted/README.md).

on:
  push:
    branches: [multitenant]
    paths: ['hosted/**', 'worker/src/**', '.github/workflows/hosted.yml']
  pull_request:
    paths: ['hosted/**', 'worker/src/**', '.github/workflows/hosted.yml']

permissions:
  contents: read

concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hosted

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
      # Builds first: the build generates src/routeTree.gen.ts, which typecheck needs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

